name: CI

# Lints every PHP file and verifies the autoloader on each push / pull request.
# Keeps the release pipeline green and prevents accidental syntax regressions.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint & autoload check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.1', '8.2', '8.3', '8.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Lint all PHP files
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null 2>&1; then
              php -l "$file" || true
              fail=1
            fi
          done < <(find . -name "*.php" -not -path "./vendor/*" -print0)
          exit "$fail"

      - name: Install dependencies (for autoload check)
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Autoload smoke test
        env:
          ITIH_VERSION: '1.0.0'
          ITIH_FILE: 'itih-ai-chatbot.php'
        run: |
          php -r '
          define("ABSPATH", "/tmp/");
          define("ITIH_VERSION", "1.0.0");
          define("ITIH_FILE", __FILE__);
          define("ITIH_DIR", getcwd() . "/");
          define("ITIH_URL", "");
          define("ITIH_BASENAME", "itih-ai-chatbot/itih-ai-chatbot.php");
          define("ITIH_DB_VERSION", "1.0.0");
          define("ITIH_REST_NAMESPACE", "itih/v1");
          define("ITIH_OPTION_PREFIX", "openrag_");
          require ITIH_DIR . "includes/class-autoloader.php";
          ItihRag\Autoloader::register();
          $classes = [
            "ItihRag\\Plugin","ItihRag\\Activator","ItihRag\\Settings",
            "ItihRag\\Database\\Schema",
            "ItihRag\\Embeddings\\Embedding_Manager","ItihRag\\Embeddings\\OpenAI_Embedding",
            "ItihRag\\LLM\\LLM_Manager","ItihRag\\LLM\\OpenAI_LLM","ItihRag\\LLM\\Anthropic_LLM",
            "ItihRag\\VectorStores\\MySQL_Store","ItihRag\\VectorStores\\Cloudflare_Vectorize",
            "ItihRag\\Ingestion\\Ingestion_Pipeline","ItihRag\\Queue\\Background_Processor",
            "ItihRag\\Chat\\Chat_Controller","ItihRag\\MCP\\MCP_Manager",
            "ItihRag\\Admin\\Admin_Menu","ItihRag\\Admin\\Settings_Page",
          ];
          $missing = [];
          foreach ($classes as $c) {
            if (!class_exists($c) && !interface_exists($c)) $missing[] = $c;
          }
          if ($missing) { echo "MISSING:\n - " . implode("\n - ", $missing) . "\n"; exit(1); }
          echo "OK: loaded " . count($classes) . " core classes\n";
          '

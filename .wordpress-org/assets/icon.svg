<?xml version="1.0" encoding="UTF-8"?>
<!-- WP OpenRag plugin icon source (128x128 logical). Rasterized to icon-128.png and icon-256.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="WP OpenRag">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Speech bubble (chat) -->
  <path d="M32 38 h64 a8 8 0 0 1 8 8 v32 a8 8 0 0 1 -8 8 h-12 l-14 12 v-12 h-38 a8 8 0 0 1 -8 -8 v-32 a8 8 0 0 1 8 -8 z"
        fill="#ffffff" fill-opacity="0.95"/>

  <!-- Three retrieval dots (RAG) -->
  <circle cx="50" cy="62" r="6" fill="url(#accent)"/>
  <circle cx="72" cy="62" r="6" fill="url(#accent)"/>
  <circle cx="94" cy="62" r="6" fill="url(#accent)"/>

  <!-- Spark (AI) -->
  <path d="M64 22 l3.5 9 l9 3.5 l-9 3.5 l-3.5 9 l-3.5 -9 l-9 -3.5 l9 -3.5 z" fill="#fde68a" opacity="0.95"/>
</svg>
